[package]
name = "bridge-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
fs2 = "0.4"
walkdir = "2"
dirs = "6"
tempfile = "3"
libc = "0.2"
sysinfo = "0.37"
p256 = { version = "0.13", features = ["ecdh"] }
aes-gcm = "0.10"
hkdf = "0.12"
base64 = "0.22"
zeroize = "1"
url = "2"
